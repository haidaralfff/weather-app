<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <meta
      name="description"
      content="Prakiraan cuaca dan status hujan harian untuk Kota Kebumen berdasarkan data resmi BMKG."
    />
    <title>Cuaca Kebumen · Prakiraan Hujan BMKG</title>
    <script>
      try {
        if (localStorage.getItem('cuaca_kebumen_theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#eef3f7');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&icon_names=air,bedtime,calendar_view_day,check_circle,close,cloud,cloud_off,dark_mode,foggy,light_mode,location_on,menu,nights_stay,partly_cloudy_day,rainy,refresh,schedule,sunny,thunderstorm,today,water_drop"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
